<script>
  let currentLang = 'it';
  function setLang(lang) {
      currentLang = lang;
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      const btn = document.querySelector(`.lang-btn[onclick="setLang('${lang}')"]`);
      if (btn) btn.classList.add('active');
      document.querySelectorAll('[data-it]').forEach(el => {
        const text = el.getAttribute('data-' + lang) || el.getAttribute('data-en') || el.getAttribute('data-it');
        if (!text) return;
        if (el.querySelector('span[data-it]')) return;
        el.innerHTML = text;
      });
      document.documentElement.lang = lang;
      try { localStorage.setItem('colgo_lang', lang); } catch (e) {}
    }
  (function () {
        var supported = ['it', 'en', 'fr', 'de'];
        var saved = null;
        try { saved = localStorage.getItem('colgo_lang'); } catch (e) {}
        var initial;
        if (saved && supported.indexOf(saved) !== -1) {
          initial = saved;
        } else {
          var nav = ((navigator.language || navigator.userLanguage || 'it') + '').slice(0, 2).toLowerCase();
          initial = supported.indexOf(nav) !== -1 ? nav : 'it';
        }
        setLang(initial);
      })();
</script>
