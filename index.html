<head>
  <meta charset="UTF-8" />

  <title>Colgo — Il catalogo digitale per qualsiasi struttura</title>
  <meta name="description" content="Colgo porta il tuo catalogo sul telefono dei tuoi clienti. Configurabile, sempre aggiornato, senza complicazioni." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Josefin+Sans:wght@200;300;400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* Palette principale Colgo */
      --black:         #0D0D0D;   /* near-black — profondità, overlay */
      --petrol:        #1E3A35;   /* petrol green — sfondo dark, header */
      --petrol-deep:   #10231F;   /* verde profondo — sfumature dark */
      --petrol-deeper: #142C27;   /* verde più profondo — gradienti */
      --ochre:         #C8922A;   /* oro caldo — accento principale */
      --ochre-dark:    #9E6F1F;   /* bronzo — ombre ochre */
      --ochre-dim:     rgba(200,146,42,0.15);
      --ochre-faint:   rgba(200,146,42,0.08);

      /* Testi */
      --cream:         #F5F1E8;   /* testo primario dark / sfondo light */
      --warm-white:    #FAF7F0;   /* sfondo luminoso / card light */
      --grey-green:    #AEB8AE;   /* testo secondario dark */
      --grey-text:     #5E6B66;   /* testo secondario light */

      /* Alias per compatibilità template */
      --gold:          #C8922A;
      --gold-light:    #d4a84b;
      --gold-dim:      rgba(200,146,42,0.15);
      --white:         #F5F1E8;
      --white-dim:     rgba(245,241,232,0.5);
      --white-faint:   rgba(245,241,232,0.08);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--black);
      color: var(--cream);
      font-family: 'Josefin Sans', sans-serif;
      font-weight: 300;
      overflow-x: hidden;
      cursor: default;
    }

    /* ── GRAIN OVERLAY ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 999;
      opacity: 0.4;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 48px;
      background: linear-gradient(to bottom, rgba(13,13,13,0.95), transparent);
    }

    .nav-logo {
      height: 28px;
      opacity: 0.95;
    }

    .nav-lang {
      display: flex;
      gap: 6px;
    }

    .lang-btn {
      background: none;
      border: none;
      color: var(--white-dim);
      font-family: 'Josefin Sans', sans-serif;
      font-size: 11px;
      letter-spacing: 2px;
      cursor: pointer;
      padding: 4px 8px;
      transition: color 0.2s;
    }

    .lang-btn.active, .lang-btn:hover { color: var(--gold); }
    .lang-btn:first-child::after { content: '/'; margin-left: 6px; color: var(--white-faint); }

    /* ── HERO ── */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 120px 32px 80px;
      position: relative;
      overflow: hidden;
    }

    .hero-glow {
      position: absolute;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(30,58,53,0.5) 0%, rgba(200,146,42,0.06) 40%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .hero-icon {
      width: 88px;
      height: 88px;
      margin-bottom: 48px;
      opacity: 0;
      animation: fadeUp 1s ease 0.2s forwards;
      flex-shrink: 0;
    }

    .hero-icon svg { width: 100%; height: 100%; }

    #hero-pupil, #hero-shine {
      transition: transform 0.4s cubic-bezier(0.25,0,0.75,1);
    }

    .hero-eyebrow {
      font-size: 10px;
      letter-spacing: 4px;
      color: var(--gold);
      margin-bottom: 28px;
      opacity: 0;
      animation: fadeUp 1s ease 0.4s forwards;
    }

    .hero-headline {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(36px, 6vw, 72px);
      line-height: 1.15;
      max-width: 760px;
      margin-bottom: 28px;
      opacity: 0;
      animation: fadeUp 1s ease 0.6s forwards;
    }

    .hero-headline em {
      font-style: italic;
      color: var(--gold-light);
    }

    .hero-sub {
      font-size: 14px;
      letter-spacing: 1px;
      color: var(--white-dim);
      max-width: 480px;
      line-height: 1.9;
      margin-bottom: 52px;
      opacity: 0;
      animation: fadeUp 1s ease 0.8s forwards;
    }

    .hero-cta {
      opacity: 0;
      animation: fadeUp 1s ease 1s forwards;
    }

    .btn-primary {
      display: inline-block;
      background: var(--gold);
      color: var(--black);
      font-family: 'Josefin Sans', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 3px;
      padding: 18px 40px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.25s, transform 0.2s;
    }

    .btn-primary:hover {
      background: var(--gold-light);
      transform: translateY(-2px);
    }

    .btn-ghost {
      display: inline-block;
      background: transparent;
      color: var(--white-dim);
      font-family: 'Josefin Sans', sans-serif;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 3px;
      padding: 18px 40px;
      border: 1px solid rgba(245,241,232,0.15);
      cursor: pointer;
      text-decoration: none;
      transition: border-color 0.25s, color 0.25s;
      margin-left: 16px;
    }

    .btn-ghost:hover {
      border-color: var(--gold);
      color: var(--gold);
    }

    .hero-scroll {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      opacity: 0;
      animation: fadeUp 1s ease 1.4s forwards;
    }

    .scroll-line {
      width: 1px;
      height: 48px;
      background: linear-gradient(to bottom, var(--gold), transparent);
      animation: scrollPulse 2s ease infinite;
    }

    /* ── DIVIDER ── */
    .gold-line {
      width: 60px;
      height: 1px;
      background: var(--gold);
      margin: 0 auto 64px;
      opacity: 0.4;
    }

    /* ── SECTION ── */
    section {
      padding: 120px 32px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .section-label {
      font-size: 10px;
      letter-spacing: 4px;
      color: var(--gold);
      margin-bottom: 20px;
      text-align: center;
    }

    .section-title {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(28px, 4vw, 48px);
      text-align: center;
      margin-bottom: 20px;
      line-height: 1.2;
    }

    .section-title em {
      font-style: italic;
      color: var(--gold-light);
    }

    .section-sub {
      font-size: 13px;
      color: var(--white-dim);
      text-align: center;
      max-width: 520px;
      margin: 0 auto 72px;
      line-height: 1.9;
      letter-spacing: 0.5px;
    }

    /* ── PROBLEM GRID ── */
    .problem-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 2px;
      margin-bottom: 64px;
    }

    .problem-card {
      background: rgba(30,58,53,0.2);
      padding: 40px 36px;
      position: relative;
      overflow: hidden;
      transition: background 0.3s;
    }

    .problem-card:hover { background: rgba(30,58,53,0.35); }

    .problem-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 2px; height: 0;
      background: var(--gold);
      transition: height 0.4s ease;
    }

    .problem-card:hover::before { height: 100%; }

    .problem-icon {
      font-size: 28px;
      margin-bottom: 20px;
      display: block;
      opacity: 0.7;
    }

    .problem-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-weight: 400;
      margin-bottom: 12px;
      color: var(--white);
    }

    .problem-desc {
      font-size: 12px;
      color: var(--white-dim);
      line-height: 1.8;
      letter-spacing: 0.3px;
    }

    .problem-vs {
      text-align: center;
      padding: 48px 0;
    }

    .vs-label {
      font-size: 10px;
      letter-spacing: 4px;
      color: var(--gold);
      margin-bottom: 24px;
    }

    .vs-statement {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(20px, 3vw, 32px);
      font-weight: 300;
      line-height: 1.5;
      max-width: 600px;
      margin: 0 auto;
    }

    /* ── HOW IT WORKS ── */
    .steps {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      margin-top: 0;
    }

    .step {
      padding: 48px 36px;
      background: rgba(30,58,53,0.2);
      position: relative;
      text-align: center;
    }

    .step-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 64px;
      font-weight: 300;
      color: var(--gold);
      opacity: 0.2;
      line-height: 1;
      margin-bottom: 24px;
    }

    .step-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 400;
      margin-bottom: 14px;
    }

    .step-desc {
      font-size: 12px;
      color: var(--white-dim);
      line-height: 1.8;
      letter-spacing: 0.3px;
    }

    /* ── FOR WHO ── */
    .who-list {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-top: 48px;
    }

    .who-tag {
      border: 1px solid rgba(200,146,42,0.3);
      padding: 12px 24px;
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--white-dim);
      transition: border-color 0.2s, color 0.2s;
    }

    .who-tag:hover {
      border-color: var(--gold);
      color: var(--gold);
    }

    /* ── PRICING ── */
    .pricing-wrap {
      max-width: 560px;
      margin: 0 auto;
    }

    .pricing-card {
      border: 1px solid rgba(200,146,42,0.2);
      padding: 64px 48px;
      text-align: center;
      position: relative;
      background: linear-gradient(135deg, rgba(30,58,53,0.25), rgba(16,35,31,0.15));
    }

    .pricing-badge {
      position: absolute;
      top: -1px; left: 50%;
      transform: translateX(-50%);
      background: var(--gold);
      color: var(--black);
      font-size: 9px;
      letter-spacing: 2px;
      font-weight: 600;
      padding: 6px 20px;
    }

    .pricing-name {
      font-size: 10px;
      letter-spacing: 4px;
      color: var(--gold);
      margin-bottom: 32px;
    }

    .pricing-amount {
      font-family: 'Cormorant Garamond', serif;
      font-size: 72px;
      font-weight: 300;
      line-height: 1;
      margin-bottom: 8px;
    }

    .pricing-amount sup {
      font-size: 28px;
      vertical-align: super;
      opacity: 0.6;
    }

    .pricing-period {
      font-size: 11px;
      color: var(--white-dim);
      letter-spacing: 2px;
      margin-bottom: 16px;
    }

    .pricing-annual {
      font-size: 11px;
      color: var(--gold);
      letter-spacing: 1px;
      margin-bottom: 48px;
    }

    .pricing-features {
      list-style: none;
      margin-bottom: 48px;
      text-align: left;
    }

    .pricing-features li {
      font-size: 12px;
      color: var(--white-dim);
      padding: 12px 0;
      border-bottom: 1px solid var(--white-faint);
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .pricing-features li::before {
      content: '—';
      color: var(--gold);
      font-size: 10px;
      flex-shrink: 0;
    }

    .pricing-note {
      font-size: 11px;
      color: var(--white-dim);
      margin-top: 24px;
      letter-spacing: 0.5px;
      line-height: 1.8;
    }

    /* ── CTA FINAL ── */
    .cta-section {
      text-align: center;
      padding: 160px 32px;
      position: relative;
      overflow: hidden;
    }

    .cta-section::before {
      content: '';
      position: absolute;
      width: 800px;
      height: 800px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(30,58,53,0.4) 0%, rgba(200,146,42,0.04) 50%, transparent 65%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .cta-headline {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(32px, 5vw, 60px);
      line-height: 1.2;
      max-width: 680px;
      margin: 0 auto 48px;
    }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid var(--white-faint);
      padding: 48px 48px 64px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .footer-logo { height: 20px; opacity: 0.5; }

    .footer-copy {
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--white-dim);
      opacity: 0.4;
    }

    /* ── ANIMATIONS ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes scrollPulse {
      0%, 100% { opacity: 0.3; transform: scaleY(1); }
      50%       { opacity: 1;   transform: scaleY(1.1); }
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 700px) {
      nav { padding: 24px 24px; }
      .problem-grid { grid-template-columns: 1fr; }
      .steps { grid-template-columns: 1fr; }
      .btn-ghost { margin-left: 0; margin-top: 12px; display: block; text-align: center; }
      footer { flex-direction: column; gap: 16px; text-align: center; }
      .pricing-card { padding: 48px 28px; }
    }
  </style>
</head>

  <!-- HERO -->
  <div class="hero">
    <div class="hero-glow"></div>
    <div class="hero-icon">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <!-- cerchio esterno ocra -->
        <circle cx="50" cy="50" r="44" fill="none" stroke="#C8922A" stroke-width="2.2"/>
        <!-- virgola interna — ruota -->
        <g id="hero-virgola" style="transform-origin:50px 50px;">

    <div class="hero-scroll">
      <div class="scroll-line"></div>
    </div>
  </div>

  <!-- PROBLEMA -->
  <section>
    <div class="section-label" data-it="IL PROBLEMA" data-en="THE PROBLEM"></div>
    <h2 class="section-title" data-it="Come comunica oggi la tua struttura con i tuoi clienti?" data-en="How does your business communicate with customers today?"></h2>
    <p class="section-sub" data-it="Quattro soluzioni che esistono già. Nessuna pensata davvero per chi è già lì." data-en="Four solutions that already exist. None truly designed for the person already there."></p>

    <div class="problem-grid">
      <div class="problem-card">
        <span class="problem-icon">📄</span>
        <div class="problem-title" data-it="Il foglio stampato" data-en="The printed sheet"></div>

        <p class="problem-desc" data-it="Orari, prezzi, disponibilità — il tuo staff risponde dieci volte al giorno alle stesse cose. Tempo sprecato per tutti." data-en="Hours, prices, availability — your staff answers the same things ten times a day. Time wasted for everyone."></p>
      </div>

      </div>

    <div class="problem-vs">

    </div>
  </section>

  <!-- COME FUNZIONA -->
  <section id="come-funziona" style="padding-top:0;">
    <div class="gold-line"></div>
    <div class="section-label" data-it="COME FUNZIONA" data-en="HOW IT WORKS"></div>
    <h2 class="section-title" data-it="Tre passi. Nessun tecnico." data-en="Three steps. No technician needed."></h2>

  <script>
    let currentLang = 'en';

    function setLang(lang) {
      currentLang = lang;
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      document.querySelector(`.lang-btn[onclick="setLang('${lang}')"]`).classList.add('active');
      document.querySelectorAll('[data-it]').forEach(el => {
        const text = el.getAttribute('data-' + lang);
        if (!text) return;
        if (el.tagName === 'H1' || el.tagName === 'H2') {
          el.innerHTML = `<span data-it="${el.querySelector('span')?.getAttribute('data-it') || ''}" data-en="${el.querySelector('span')?.getAttribute('data-en') || ''}">${text}</span>`;
          return;
        }
        if (el.querySelector('span[data-it]')) return;
        el.innerHTML = text;
      });
      document.documentElement.lang = lang;
    }

    // ── ANIMAZIONE OCCHIO HERO ──
    const heroMoves = [
      {dx:0,  dy:0,  rot:0  },
      {dx:-12,dy:2,  rot:45 },
      {dx:13, dy:-2, rot:90 },
      {dx:0,  dy:-12,rot:140},
      {dx:11, dy:-5, rot:195},
      {dx:0,  dy:11, rot:250},
      {dx:-11,dy:5,  rot:310},
      {dx:0,  dy:0,  rot:360},
    ];
    let hmi = 0;
    const hp  = document.getElementById('hero-pupil');
    const hs  = document.getElementById('hero-shine');
    const hvg = document.getElementById('hero-virgola');
    if (hp) {
      hp.style.transition  = 'transform 0.45s cubic-bezier(0.25,0,0.75,1)';
      hs.style.transition  = 'transform 0.45s cubic-bezier(0.25,0,0.75,1)';
    }
    setInterval(() => {
      hmi = (hmi + 1) % heroMoves.length;
      const m = heroMoves[hmi];
      if (hp)  hp.style.transform  = `translate(${m.dx}px,${m.dy}px)`;
      if (hs)  hs.style.transform  = `translate(${m.dx}px,${m.dy}px)`;
      if (hvg) {
        hvg.style.transition = 'transform 0.55s cubic-bezier(0.25,0,0.75,1)';
        hvg.style.transform  = `rotate(${m.rot}deg)`;
      }
    }, 900);

    // Init
    setLang('en');

    // Scroll reveal
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (e.isIntersecting) {
          e.target.style.opacity = '1';
          e.target.style.transform = 'translateY(0)';
        }
      });
    }, { threshold: 0.1 });

    document.querySelectorAll('.problem-card, .step, .who-tag, .pricing-card').forEach(el => {
      el.style.opacity = '0';
      el.style.transform = 'translateY(24px)';
      el.style.transition = 'opacity 0.7s ease, transform 0.7s ease';
      observer.observe(el);
    });
  </script>
