  <style>
    :root{--black:#0D0D0D;--petrol:#1E3A35;--ochre:#C8922A;--ochre-l:#d4a84b;--cream:#F5F1E8;--grey:#AEB8AE;--white-dim:rgba(245,241,232,0.8);--white-faint:rgba(245,241,232,0.08);--gold:#C8922A;--gold-light:#d4a84b;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{scroll-behavior:smooth;}
    body{background:var(--black);color:var(--cream);font-family:'Josefin Sans',sans-serif;font-weight:300;overflow-x:hidden;}
    body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:999;opacity:0.4;}
    nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:28px 48px;background:linear-gradient(to bottom,rgba(13,13,13,0.95),transparent);}
    .nav-logo{height:28px;opacity:0.95;}
    .nav-right{display:flex;align-items:center;gap:32px;}
    .nav-links{display:flex;gap:24px;}
    .nav-links a{color:var(--white-dim);text-decoration:none;font-size:11px;letter-spacing:2px;transition:color 0.2s;}
    .nav-links a:hover,.nav-links a.active{color:var(--ochre);}
    .nav-lang{display:flex;gap:6px;}
    .lang-btn{background:none;border:none;color:var(--white-dim);font-family:'Josefin Sans',sans-serif;font-size:11px;letter-spacing:2px;cursor:pointer;padding:4px 8px;transition:color 0.2s;}
    .lang-btn.active,.lang-btn:hover{color:var(--gold);}
    .lang-btn:first-child::after{content:'/';margin-left:6px;color:var(--white-faint);}
    .page-hero{padding:160px 32px 80px;text-align:center;position:relative;overflow:hidden;}
    .page-hero-glow{position:absolute;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(30,58,53,0.4) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;}
    .page-label{font-size:10px;letter-spacing:4px;color:var(--ochre);margin-bottom:24px;position:relative;z-index:1;}
    .page-title{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(36px,5vw,64px);line-height:1.15;margin-bottom:24px;position:relative;z-index:1;}
    .page-title em{font-style:italic;color:var(--ochre-l);}
    .page-sub{font-size:14px;letter-spacing:1px;color:var(--white-dim);max-width:560px;margin:0 auto;line-height:1.9;position:relative;z-index:1;}
    .venues-section{max-width:1000px;margin:0 auto;padding:80px 32px 120px;}
    .gold-line{width:1px;height:60px;background:linear-gradient(to bottom,transparent,var(--ochre),transparent);margin:0 auto 64px;}
    .venues-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:2px;}
    .venue-card{background:rgba(245,241,232,0.03);border:1px solid rgba(245,241,232,0.07);padding:48px 36px;transition:background 0.3s,border-color 0.3s;}
    .venue-card:hover{background:rgba(30,58,53,0.25);border-color:rgba(200,146,42,0.25);}
    .venue-icon{font-size:36px;margin-bottom:24px;}
    .venue-type{font-size:10px;letter-spacing:4px;color:var(--ochre);margin-bottom:12px;}
    .venue-title{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:28px;line-height:1.2;margin-bottom:20px;}
    .venue-title em{font-style:italic;color:var(--ochre-l);}
    .venue-desc{font-size:13px;color:var(--white-dim);line-height:1.9;margin-bottom:20px;}
    .venue-tag{display:inline-block;font-size:9px;letter-spacing:2px;color:rgba(200,146,42,0.85);padding:2px 0;margin:4px 8px 0 0;}
    .principle-section{background:var(--petrol);padding:100px 32px;text-align:center;position:relative;overflow:hidden;}
    .principle-section::before{content:'';position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(200,146,42,0.08) 0%,transparent 65%);top:50%;left:50%;transform:translate(-50%,-50%);}
    .section-label{font-size:10px;letter-spacing:4px;color:var(--ochre);margin-bottom:24px;position:relative;z-index:1;}
    .section-title{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(28px,4vw,52px);line-height:1.2;margin-bottom:16px;position:relative;z-index:1;}
    .section-title em{font-style:italic;color:var(--ochre-l);}
    .section-sub{font-size:14px;color:var(--white-dim);max-width:600px;margin:0 auto;line-height:1.9;position:relative;z-index:1;}
    .cta-section{text-align:center;padding:100px 32px;}
    .cta-headline{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(32px,4vw,56px);line-height:1.2;margin-bottom:40px;}
    .cta-headline em{font-style:italic;color:var(--ochre-l);}
    .cta-buttons{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}
    .btn-primary{display:inline-block;background:var(--ochre);color:var(--black);font-family:'Josefin Sans',sans-serif;font-size:11px;font-weight:600;letter-spacing:3px;padding:18px 40px;text-decoration:none;transition:background 0.25s;}
    .btn-primary:hover{background:var(--ochre-l);}
    .btn-ghost{display:inline-block;border:1px solid rgba(200,146,42,0.4);color:var(--ochre);font-family:'Josefin Sans',sans-serif;font-size:11px;letter-spacing:3px;padding:18px 40px;text-decoration:none;transition:border-color 0.25s;}
    .btn-ghost:hover{border-color:var(--ochre);}
    footer{text-align:center;padding:48px 32px;border-top:1px solid rgba(245,241,232,0.06);font-size:10px;letter-spacing:2px;color:rgba(245,241,232,0.4);}
    footer a{color:rgba(245,241,232,0.5);text-decoration:none;}
    footer a:hover{color:var(--ochre);}
    .footer-links{display:flex;gap:24px;justify-content:center;margin-bottom:16px;flex-wrap:wrap;}
    @media(max-width:700px){nav{padding:20px 24px;}.nav-links{display:none;}.venues-section{padding:40px 20px 80px;}.venues-grid{grid-template-columns:1fr;}}

<div class="page-hero">

  <div class="page-label" data-it="PER CHI È COLGO" data-en="WHO IS COLGO FOR"></div>
  <h1 class="page-title" data-it="Un motore solo.<br/><em>Ogni contesto.</em>" data-en="One engine.<br/><em>Every context.</em>"></h1>
  <p class="page-sub" data-it="Colgo si adatta a qualsiasi struttura con un catalogo e dei clienti. Il termine 'camera' diventa tavolo, piazzola, ormeggio — in base a come lo configuri." data-en="Colgo adapts to any business with a catalogue and customers. The word 'room' becomes table, pitch, berth — based on how you configure it."></p>
</div>

<div class="venues-section">
  <div class="gold-line"></div>
  <div class="venues-grid">

    <div class="venue-card">
      <div class="venue-icon">🏨</div>
      <div class="venue-type" data-it="STRUTTURA RICETTIVA" data-en="ACCOMMODATION"></div>
      <h2 class="venue-title" data-it="Hotel, B&B, <em>agriturismi</em>" data-en="Hotels, B&Bs, <em>farm stays</em>"></h2>
      <p class="venue-desc" data-it="L'ospite riceve il link prima dell'arrivo e pianifica il soggiorno. In camera scansiona il QR e trova servizi, info locali e orari. Le richieste arrivano in reception in tempo reale." data-en="The guest gets the link before arrival and plans their stay. In the room they scan the QR and find services, local info and hours. Requests arrive at reception in real time."></p>
      <div>
        <span class="venue-tag" data-it="PRE-ARRIVO" data-en="PRE-ARRIVAL"></span>
        <span class="venue-tag" data-it="QR IN CAMERA" data-en="QR IN ROOM"></span>
        <span class="venue-tag" data-it="4 LINGUE" data-en="4 LANGUAGES"></span>
      </div>
    </div>

    <div class="venue-card">
      <div class="venue-icon">⛺</div>
      <div class="venue-type" data-it="OUTDOOR" data-en="OPEN-AIR"></div>
      <h2 class="venue-title" data-it="Campeggi, villaggi e <em>porti turistici</em>" data-en="Campsites, villages and <em>tourist marinas</em>"></h2>
      <p class="venue-desc" data-it="Il QR è sulla piazzola, sul bungalow o sull'ormeggio. Il cliente sa quali servizi ci sono, gli orari del bar, le attività disponibili — senza alzarsi e senza chiamare." data-en="The QR is on the pitch, bungalow or berth. The customer knows what services are available, bar hours, activities — without getting up or calling."></p>
      <div>
        <span class="venue-tag" data-it="PIAZZOLA / ORMEGGIO" data-en="PITCH / BERTH"></span>
        <span class="venue-tag" data-it="SERVIZI OUTDOOR" data-en="OUTDOOR SERVICES"></span>
      </div>
    </div>

    <div class="venue-card">
      <div class="venue-icon">🍽️</div>
      <div class="venue-type" data-it="RISTORAZIONE" data-en="FOOD SERVICE"></div>
      <h2 class="venue-title" data-it="Ristoranti, bar, <em>stabilimenti balneari</em>" data-en="Restaurants, bars, <em>beach clubs</em>"></h2>
      <p class="venue-desc" data-it="Il cameriere scansiona il QR del tavolo e invia l'ordine direttamente alla cucina. Il cliente non tocca nulla — il flusso è tutto interno." data-en="The waiter scans the table QR and sends the order directly to the kitchen. The customer touches nothing — the flow is entirely internal."></p>
      <div>
        <span class="venue-tag" data-it="USO INTERNO" data-en="INTERNAL USE"></span>
        <span class="venue-tag" data-it="CUCINA REAL-TIME" data-en="KITCHEN REAL-TIME"></span>
      </div>
    </div>

    <div class="venue-card">
      <div class="venue-icon">🏪</div>
      <div class="venue-type" data-it="RETAIL" data-en="RETAIL"></div>
      <h2 class="venue-title" data-it="Negozi, boutique e <em>showroom</em>" data-en="Shops, boutiques and <em>showrooms</em>"></h2>
      <p class="venue-desc" data-it="Il QR è sulla vetrina. Il cliente scansiona il QR dalla vetrina, anche a negozio chiuso, sfoglia il catalogo e prepara la sua lista — e quando entra sa già cosa vuole." data-en="The QR is on the window. The customer scans the QR from the window, even outside opening hours, browses the catalogue and prepares their list — and when they walk in they already know what they want."></p>
      <div>
        <span class="venue-tag" data-it="QR IN VETRINA" data-en="QR ON WINDOW"></span>
        <span class="venue-tag" data-it="CATALOGO 24/7" data-en="CATALOGUE 24/7"></span>
      </div>
    </div>

    <div class="venue-card">
      <div class="venue-icon">🌊</div>
      <div class="venue-type" data-it="BENESSERE" data-en="WELLNESS"></div>
      <h2 class="venue-title" data-it="Spa, centri benessere e <em>centri sportivi</em>" data-en="Spa, wellness centres and <em>sports clubs</em>"></h2>
      <p class="venue-desc" data-it="Trattamenti, orari, info — tutto accessibile via QR in sala d'attesa o reception. Il cliente sceglie e chiede. Lo staff riceve senza interruzioni continue al banco." data-en="Treatments, hours, info — all accessible via QR in the waiting room or reception. The customer chooses, sends a request or books. Staff receive requests without constant interruptions."></p>
      <div>
        <span class="venue-tag" data-it="TRATTAMENTI" data-en="TREATMENTS"></span>
        <span class="venue-tag" data-it="INFO SERVIZI" data-en="SERVICE INFO"></span>
      </div>
    </div>

    <div class="venue-card">
      <div class="venue-icon">🏖️</div>
      <div class="venue-type" data-it="TURISMO" data-en="TOURISM"></div>
      <h2 class="venue-title" data-it="Stabilimenti balneari, <em>porti turistici</em>" data-en="Beach clubs, <em>tourist marinas</em>"></h2>
      <p class="venue-desc" data-it="L'ombrellone, la barca, il posto in spiaggia — ognuno con il suo QR. Il cliente ordina, lo staff riceve tutto sul telefono senza correre avanti e indietro." data-en="The sun lounger, boat, beach spot — each with its own QR. The customer orders, staff receive everything on their phone without running back and forth."></p>
      <div>
        <span class="venue-tag" data-it="OMBRELLONE / BARCA" data-en="LOUNGER / BOAT"></span>
        <span class="venue-tag" data-it="STAFF MOBILE" data-en="MOBILE STAFF"></span>
      </div>
    </div>

  </div>
</div>

<div class="principle-section">
  <div class="section-label" data-it="IL PRINCIPIO" data-en="THE PRINCIPLE"></div>
  <h2 class="section-title" data-it="Se hai un catalogo e dei clienti, <em>Colgo funziona.</em>" data-en="If you have a catalogue and customers, <em>Colgo works.</em>"></h2>
  <p class="section-sub" data-it="Non serve un gestionale enorme. Non serve integrarsi con niente. Basta avere qualcosa da offrire e voler comunicarlo meglio — Colgo fa il resto." data-en="You don't need a massive management system. You don't need to integrate with anything. Just have something to offer and want to communicate it better — Colgo does the rest."></p>
</div>

<script>
  let currentLang = 'it';
  function setLang(lang) {
    currentLang = lang;
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`.lang-btn[onclick="setLang('${lang}')"]`).classList.add('active');
    document.querySelectorAll('[data-it]').forEach(el => {
      const text = el.getAttribute('data-' + lang);
      if (!text) return;
      el.innerHTML = text;
    });
    document.documentElement.lang = lang;
  }
  setLang('it');
</script>
