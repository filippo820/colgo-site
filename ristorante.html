    <!-- Google Analytics 4 — Colgo (tracciamento esteso) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-4JCQ1EGSR9"></script>
  <script>
  (function(){
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    window.gtag = gtag;
    gtag('js', new Date());

    // Lingua scelta dall'utente (il sito cambia lingua senza cambiare URL:
    // senza questo parametro GA non saprebbe mai in che lingua è stata letta la pagina)
    var lang = 'it';
    try { lang = localStorage.getItem('colgo_lang') || document.documentElement.lang || 'it'; } catch(e){}

    // Nome pulito della pagina (home, prezzi, hotel, ristorante...)
    var slug = location.pathname.replace(/\/+$/,'').split('/').pop() || 'home';
    slug = slug.replace(/\.html$/,'') || 'home';

    gtag('config', 'G-4JCQ1EGSR9', {
      colgo_lang: lang,
      colgo_page: slug
    });

    var t0 = Date.now(), maxScroll = 0, sent = {};
    function ev(name, params){ params = params || {}; params.colgo_lang = lang; params.colgo_page = slug; gtag('event', name, params); }
    function secs(){ return Math.round((Date.now() - t0)/1000); }

    function start(){

      // 1. PROFONDITÀ DI LETTURA — quanto scende nella pagina
      function onScroll(){
        var h = document.documentElement.scrollHeight - window.innerHeight;
        if (h <= 0) return;
        var pct = Math.min(100, Math.round((window.scrollY / h) * 100));
        if (pct > maxScroll) maxScroll = pct;
        [25,50,75,90,100].forEach(function(s){
          if (pct >= s && !sent['s'+s]) { sent['s'+s] = 1; ev('scroll_depth', { percent: s, seconds: secs() }); }
        });
      }
      window.addEventListener('scroll', onScroll, { passive:true });
      onScroll();

      // 2. TEMPO SULLA PAGINA — soglie progressive
      [10,30,60,120,300].forEach(function(s){
        setTimeout(function(){ if (!document.hidden) ev('time_on_page', { seconds: s }); }, s*1000);
      });

      // 3. SEZIONI EFFETTIVAMENTE VISTE — dove si è fermato a leggere
      if ('IntersectionObserver' in window) {
        var io = new IntersectionObserver(function(entries){
          entries.forEach(function(en){
            if (!en.isIntersecting) return;
            var el = en.target;
            var name = el.id || (el.querySelector('h1,h2,h3') ? el.querySelector('h1,h2,h3').textContent.trim().slice(0,40) : '');
            if (!name || sent['sec_'+name]) return;
            sent['sec_'+name] = 1;
            ev('section_view', { section: name, seconds: secs() });
          });
        }, { threshold: 0.5 });
        document.querySelectorAll('section, header, footer').forEach(function(el){ io.observe(el); });
      }

      // 4. CLIC — CTA, navigazione, link esterni, email
      document.addEventListener('click', function(e){
        var a = e.target.closest ? e.target.closest('a') : null;
        if (!a || !a.href) return;
        var href = a.href, label = (a.textContent || '').trim().slice(0,50);
        if (href.indexOf('mailto:') === 0)            ev('click_email',   { link: href });
        else if (href.indexOf('/demo') > -1)          ev('cta_demo',      { link: href, label: label });
        else if (href.indexOf('/registrati') > -1)    ev('cta_signup',    { link: href, label: label });
        else if (href.indexOf(location.hostname) > -1) ev('nav_click',    { link: href, label: label });
        else                                          ev('click_esterno', { link: href, label: label });
      }, true);

      // 5. CAMBIO LINGUA
      if (typeof window.setLang === 'function') {
        var orig = window.setLang;
        window.setLang = function(l){ var r = orig.apply(this, arguments); lang = l; ev('lang_switch', { nuova_lingua: l }); return r; };
      }

      // 6. USCITA — durata reale e punto massimo raggiunto
      document.addEventListener('visibilitychange', function(){
        if (document.visibilityState === 'hidden' && !sent.exit) {
          sent.exit = 1;
          ev('page_exit', { seconds: secs(), max_scroll: maxScroll });
        }
      });
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
    else start();
  })();
  </script>

    nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:28px 48px;background:linear-gradient(to bottom,rgba(13,13,13,0.95),transparent);}

    .nav-lang{display:flex;gap:6px;}
    .lang-btn{background:none;border:none;color:var(--white-dim);font-family:'Josefin Sans',sans-serif;font-size:11px;letter-spacing:2px;cursor:pointer;padding:4px 8px;transition:color 0.2s;}
    .lang-btn.active,.lang-btn:hover{color:var(--gold);}
    .lang-btn:not(:last-child)::after{content:'/';margin-left:6px;color:var(--white-faint);}
    .nav-toggle{display:none;background:none;border:none;cursor:pointer;flex-direction:column;gap:5px;padding:8px;margin-left:4px;}
    .nav-toggle span{display:block;width:22px;height:2px;background:var(--cream);transition:transform .25s,opacity .25s;}
    .nav-toggle.open span:nth-child(1){transform:translateY(7px) rotate(45deg);}
    .nav-toggle.open span:nth-child(2){opacity:0;}
    .nav-toggle.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg);}

    .nav-overlay.open{display:block;}
    .page-hero{padding:160px 32px 60px;text-align:center;position:relative;overflow:hidden;}
    .page-hero-glow{position:absolute;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(30,58,53,0.4) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;}

    .page-title{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(36px,5vw,64px);line-height:1.15;margin-bottom:24px;position:relative;z-index:1;}

    .page-sub{font-size:16px;letter-spacing:1px;color:var(--white-dim);max-width:560px;margin:0 auto;line-height:1.9;position:relative;z-index:1;}

    .section-label{font-size:10px;letter-spacing:4px;color:var(--ochre);margin-bottom:24px;position:relative;z-index:1;}
    .section-title{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(28px,4vw,52px);line-height:1.2;margin-bottom:16px;position:relative;z-index:1;text-align:center;}

    .btn-ghost{display:inline-block;border:1px solid rgba(200,146,42,0.4);color:var(--ochre);font-family:'Josefin Sans',sans-serif;font-size:11px;letter-spacing:3px;padding:18px 40px;text-decoration:none;transition:border-color 0.25s;}

    footer a:hover{color:var(--ochre);}
    .footer-links{display:flex;gap:24px;justify-content:center;margin-bottom:16px;flex-wrap:wrap;}
    
    .pain-section{max-width:1000px;margin:0 auto;padding:80px 32px 40px;}
    .pain-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:2px;margin-top:48px;}
    .pain-card{background:rgba(245,241,232,0.03);border:1px solid rgba(245,241,232,0.07);padding:40px 32px;}
    .pain-icon{font-size:30px;margin-bottom:20px;opacity:0.9;}

    .flow-diagram{margin:20px 0 0;}
    .feat-section{background:var(--petrol);padding:100px 32px;text-align:center;}
    .feat-grid{max-width:900px;margin:56px auto 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:36px;text-align:left;}
    .feat-card{padding:0;}
    .feat-title{font-size:11px;letter-spacing:2px;color:var(--ochre);margin-bottom:10px;}
    .feat-desc{font-size:15px;color:var(--white-dim);line-height:1.8;}

        .screens-section{padding:90px 32px 90px;text-align:center;}
    .screens-carousel{display:flex;gap:24px;overflow-x:auto;padding:24px 6px 20px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;max-width:1100px;margin:0 auto;}
    .screens-carousel::-webkit-scrollbar{display:none;}
    .screen-item{flex:0 0 auto;scroll-snap-align:center;width:200px;text-align:left;}
    .screen-item img{width:100%;border-radius:24px;border:1px solid rgba(200,146,42,0.25);box-shadow:0 20px 50px rgba(0,0,0,0.55);display:block;}
    .screen-caption{margin-top:14px;font-size:13px;letter-spacing:0.4px;color:var(--white-dim);line-height:1.6;text-align:center;}
    .screens-hint{margin-top:4px;font-size:10px;letter-spacing:3px;color:var(--ochre);opacity:0.65;}
    @media(max-width:700px){.screen-item{width:170px;}}

    @media(max-width:700px){nav{padding:20px 24px;}.nav-toggle{display:flex;}.nav-links{position:fixed;top:0;right:0;height:100vh;width:min(78vw,300px);background:var(--black);border-left:1px solid rgba(200,146,42,0.15);flex-direction:column;justify-content:center;align-items:flex-start;gap:26px;padding:32px 40px;transform:translateX(100%);transition:transform .3s ease;z-index:100;}.nav-links.open{transform:translateX(0);}.pain-grid{grid-template-columns:1fr;}.feat-grid{grid-template-columns:1fr;}}
  
/* ── Leggibilità su telefono (15/08/2026) ────────────────────────────
   Il contrasto era già buono (11:1); il problema era la DIMENSIONE: una
   scala tipografica da poster desktop applicata identica al telefono —
   menù a 10px, tag a 9px, footer a 10px. Qui si riporta a misura di
   pollice e di occhio. Il padding sui link del menù serve a portare
   l'area toccabile a ~40px: prima era alta quanto il testo. */
@media (max-width: 700px) {
  .nav-links a { font-size: 15px; letter-spacing: 1px; color: var(--cream); padding: 6px 0; }
  .lang-btn { font-size: 14px; }

  .page-sub, .hero-sub { font-size: 15px; }
  .pain-desc, .venue-desc, .feat-desc, .step-desc,
  .problem-desc, .tech-card-desc, .section-sub,
  .pricing-features li, .faq-a, .faq-q { font-size: 14px; line-height: 1.75; }
  .screen-caption { font-size: 13px; }
  .onboarding-note, .pricing-note { font-size: 14px; }

  .venue-tag { font-size: 11px; letter-spacing: 1.5px; }
  .section-label, .page-label, .feat-title, .tech-card-title,
  .pricing-name, .verticals-label { font-size: 11px; letter-spacing: 2.5px; }
  .screens-hint { font-size: 11px; }
  footer, .footer-links a { font-size: 12px; letter-spacing: 1px; }

  .btn-primary, .btn-ghost { font-size: 12px; padding: 17px 32px; }
}

<script>
  let currentLang = 'it';
  function setLang(lang) {
      currentLang = lang;
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      const btn = document.querySelector(`.lang-btn[onclick="setLang('${lang}')"]`);
      if (btn) btn.classList.add('active');
      document.querySelectorAll('[data-it]').forEach(el => {
        const text = el.getAttribute('data-' + lang) || el.getAttribute('data-en') || el.getAttribute('data-it');
        if (!text) return;
        if (el.querySelector('span[data-it]')) return;
        el.innerHTML = text;
      });
      document.documentElement.lang = lang;
      try { localStorage.setItem('colgo_lang', lang); } catch (e) {}
    }
  (function () {
        var supported = ['it', 'en', 'fr', 'de'];
        var saved = null;
        try { saved = localStorage.getItem('colgo_lang'); } catch (e) {}
        var initial;
        if (saved && supported.indexOf(saved) !== -1) {
          initial = saved;
        } else {
          var nav = ((navigator.language || navigator.userLanguage || 'it') + '').slice(0, 2).toLowerCase();
          initial = supported.indexOf(nav) !== -1 ? nav : 'it';
        }
        setLang(initial);
      })();
</script>
